apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.streamingServer.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: streaming-server
spec:
  type: ClusterIP
  selector:
    app: noise-generator
    role: streaming-server
  ports:
    - name: udp-stream
      port: {{ .Values.streamingServer.port }}
      targetPort: udp-stream
      protocol: UDP
