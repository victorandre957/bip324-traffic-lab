apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.httpsServer.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: https-server
spec:
  type: ClusterIP
  selector:
    app: noise-generator
    role: https-server
  ports:
    - name: https
      port: {{ .Values.httpsServer.port }}
      targetPort: https
      protocol: TCP
