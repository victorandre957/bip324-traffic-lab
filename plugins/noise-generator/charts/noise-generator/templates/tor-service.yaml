apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.torServer.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: tor-da
spec:
  type: ClusterIP
  selector:
    app: noise-generator
    role: tor-da
  ports:
    - name: tor-or
      port: {{ .Values.torServer.port }}
      targetPort: tor-or
      protocol: TCP
    - name: tor-dir
      port: {{ .Values.torServer.dirPort }}
      targetPort: tor-dir
      protocol: TCP
