apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.streamingClient.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: streaming-client
spec:
  restartPolicy: Always
  containers:
    - name: streaming-client
      image: {{ .Values.streamingClient.image }}
      imagePullPolicy: IfNotPresent
      command: ["python3", "/scripts/streaming_client.py"]
      env:
        - name: SERVER
          value: "{{ printf "%s-%s" .Release.Name .Values.streamingServer.name }}"
        - name: PORT
          value: "{{ .Values.streamingServer.port }}"
        - name: HELLO_EVERY
          value: "{{ .Values.streamingClient.helloIntervalSec }}"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
  volumes:
    - name: scripts
      configMap:
        name: {{ printf "%s-noise-scripts" .Release.Name }}
