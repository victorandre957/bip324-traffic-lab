apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.obfs4Server.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: obfs4-server
spec:
  restartPolicy: Always
  containers:
    - name: obfs4-server
      image: {{ .Values.obfs4Server.image }}
      imagePullPolicy: IfNotPresent
      ports:
        - name: obfs4
          containerPort: {{ .Values.obfs4Server.port }}
          protocol: TCP
      command: ["python3", "/scripts/obfs4_noise_server.py"]
      env:
        - name: PORT
          value: "{{ .Values.obfs4Server.port }}"
        - name: MIN_BYTES
          value: "{{ .Values.obfs4Server.minBytes }}"
        - name: MAX_BYTES
          value: "{{ .Values.obfs4Server.maxBytes }}"
        - name: INTERVAL_MS
          value: "{{ .Values.obfs4Server.intervalMs }}"
        - name: SEED
          value: "{{ .Values.simulation.seed }}:obfs4-server"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
  volumes:
    - name: scripts
      configMap:
        name: {{ printf "%s-noise-scripts" .Release.Name }}
