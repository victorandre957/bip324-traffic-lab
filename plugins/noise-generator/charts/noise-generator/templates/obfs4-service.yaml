apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.obfs4Server.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: obfs4-server
spec:
  type: ClusterIP
  selector:
    app: noise-generator
    role: obfs4-server
  ports:
    - name: obfs4
      port: {{ .Values.obfs4Server.port }}
      targetPort: obfs4
      protocol: TCP
