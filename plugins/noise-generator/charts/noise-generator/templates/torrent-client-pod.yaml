apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.torrentClient.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: torrent-client
spec:
  restartPolicy: Always
  containers:
    - name: torrent-client
      image: {{ .Values.torrentClient.image }}
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "/scripts/run_torrent_client.sh"]
      env:
        - name: SERVER
          value: "{{ printf "%s-%s" .Release.Name .Values.torrentServer.name }}"
        - name: PORT
          value: "{{ .Values.torrentServer.port }}"
        - name: METADATA_PORT
          value: "{{ .Values.torrentServer.metadataPort }}"
        - name: CONNECTIONS
          value: "{{ .Values.torrentClient.connections }}"
      volumeMounts:
        - name: downloads
          mountPath: /downloads
        - name: scripts
          mountPath: /scripts
      resources:
        requests:
          cpu: "100m"
          memory: "160Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
  volumes:
    - name: downloads
      emptyDir: {}
    - name: scripts
      configMap:
        name: {{ printf "%s-noise-scripts" .Release.Name }}
