apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.streamingServer.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: streaming-server
spec:
  restartPolicy: Always
  containers:
    - name: streaming-server
      image: {{ .Values.streamingServer.image }}
      imagePullPolicy: IfNotPresent
      ports:
        - name: udp-stream
          containerPort: {{ .Values.streamingServer.port }}
          protocol: UDP
      command: ["python3", "/scripts/streaming_server.py"]
      env:
        - name: PORT
          value: "{{ .Values.streamingServer.port }}"
        - name: MIN_BYTES
          value: "{{ .Values.streamingServer.minBytes }}"
        - name: MAX_BYTES
          value: "{{ .Values.streamingServer.maxBytes }}"
        - name: INTERVAL_MS
          value: "{{ .Values.streamingServer.intervalMs }}"
        - name: SEED
          value: "{{ .Values.simulation.seed }}:streaming-server"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
  volumes:
    - name: scripts
      configMap:
        name: {{ printf "%s-noise-scripts" .Release.Name }}
