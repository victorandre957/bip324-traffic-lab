apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.server.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: server
spec:
  type: ClusterIP
  selector:
    app: noise-generator
    role: server
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
      protocol: TCP
