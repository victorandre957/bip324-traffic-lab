apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.torrentServer.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: torrent-server
spec:
  type: ClusterIP
  selector:
    app: noise-generator
    role: torrent-server
  ports:
    - name: torrent-tcp
      port: {{ .Values.torrentServer.port }}
      targetPort: torrent-tcp
      protocol: TCP
    - name: torrent-meta
      port: {{ .Values.torrentServer.metadataPort }}
      targetPort: torrent-meta
      protocol: TCP
