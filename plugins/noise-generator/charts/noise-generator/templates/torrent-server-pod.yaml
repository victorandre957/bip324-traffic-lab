apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.torrentServer.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: torrent-server
spec:
  restartPolicy: Always
  containers:
    - name: torrent-server
      image: {{ .Values.torrentServer.image }}
      imagePullPolicy: IfNotPresent
      ports:
        - name: torrent-tcp
          containerPort: {{ .Values.torrentServer.port }}
          protocol: TCP
        - name: torrent-meta
          containerPort: {{ .Values.torrentServer.metadataPort }}
          protocol: TCP
      command: ["/bin/sh", "/scripts/run_torrent_server.sh"]
      env:
        - name: LISTEN_PORT
          value: "{{ .Values.torrentServer.port }}"
        - name: METADATA_PORT
          value: "{{ .Values.torrentServer.metadataPort }}"
        - name: PAYLOAD_BYTES
          value: "{{ int .Values.torrentServer.payloadBytes }}"
        - name: PIECE_BYTES
          value: "{{ int .Values.torrentServer.pieceBytes }}"
        - name: SEED
          value: "{{ .Values.simulation.seed }}:torrent-seeder"
      volumeMounts:
        - name: data
          mountPath: /data
        - name: scripts
          mountPath: /scripts
      resources:
        requests:
          cpu: "100m"
          memory: "160Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
  volumes:
    - name: data
      emptyDir: {}
    - name: scripts
      configMap:
        name: {{ printf "%s-noise-scripts" .Release.Name }}
