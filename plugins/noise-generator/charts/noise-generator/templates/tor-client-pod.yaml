apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.torClient.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: tor-client
spec:
  restartPolicy: Always
  containers:
    - name: tor-client
      image: {{ .Values.torClient.torImage }}
      imagePullPolicy: IfNotPresent
      ports:
        - name: socks
          containerPort: 9050
          protocol: TCP
      command: ["/bin/bash", "/scripts/tor_client_entrypoint.sh"]
      env:
        - name: TORDA_HOST
          value: "{{ printf "%s-%s" .Release.Name .Values.torServer.name }}.{{ .Values.namespace }}.svc.cluster.local"
        - name: TOR_OR_PORT
          value: "{{ .Values.torServer.port }}"
        - name: TOR_DIR_PORT
          value: "{{ .Values.torServer.dirPort }}"
        - name: TOR_V3_IDENTITY
          value: "{{ .Values.torServer.v3Identity }}"
        - name: TOR_FINGERPRINT
          value: "{{ .Values.torServer.fingerprint }}"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
      resources:
        requests:
          cpu: "50m"
          memory: "96Mi"
        limits:
          cpu: "200m"
          memory: "192Mi"
    - name: tor-app-client
      image: {{ .Values.torClient.appImage }}
      imagePullPolicy: IfNotPresent
      command: ["python3", "/scripts/tor_socks_client.py"]
      env:
        - name: TARGET_HOST
          value: "{{ printf "%s-%s" .Release.Name .Values.server.name }}"
        - name: TARGET_PORT
          value: "{{ .Values.server.port }}"
        - name: MIN_SLEEP_MS
          value: "{{ .Values.torClient.minSleepMs }}"
        - name: MAX_SLEEP_MS
          value: "{{ .Values.torClient.maxSleepMs }}"
        - name: SEED
          value: "{{ .Values.simulation.seed }}:tor-client"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
  volumes:
    - name: scripts
      configMap:
        name: {{ printf "%s-noise-scripts" .Release.Name }}
