apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-%s" .Release.Name .Values.torServer.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: noise-generator
    role: tor-da
spec:
  restartPolicy: Always
  containers:
    - name: tor-da
      image: {{ .Values.torServer.image }}
      imagePullPolicy: IfNotPresent
      ports:
        - name: tor-or
          containerPort: {{ .Values.torServer.port }}
          protocol: TCP
        - name: tor-dir
          containerPort: {{ .Values.torServer.dirPort }}
          protocol: TCP
      command: ["/bin/bash", "/scripts/tor_da_entrypoint.sh"]
      env:
        - name: TORDA_HOST
          value: "{{ printf "%s-%s" .Release.Name .Values.torServer.name }}.{{ .Values.namespace }}.svc.cluster.local"
        - name: TOR_OR_PORT
          value: "{{ .Values.torServer.port }}"
        - name: TOR_DIR_PORT
          value: "{{ .Values.torServer.dirPort }}"
        - name: TOR_V3_IDENTITY
          value: "{{ .Values.torServer.v3Identity }}"
        - name: TOR_FINGERPRINT
          value: "{{ .Values.torServer.fingerprint }}"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
      resources:
        requests:
          cpu: "75m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"
  volumes:
    - name: scripts
      configMap:
        name: {{ printf "%s-noise-scripts" .Release.Name }}
